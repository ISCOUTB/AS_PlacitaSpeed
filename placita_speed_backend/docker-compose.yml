services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: placita_speed_db
    ports:
      - "5432:5432"
    networks:
      - placita-network

  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: 1234
      DB_NAME: placita_speed_db
      JWT_SECRET: placita_secret_dev_2024
    depends_on:
      - postgres
    networks:
      - placita-network

networks:
  placita-network: